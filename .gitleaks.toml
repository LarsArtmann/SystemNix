# Gitleaks configuration for SystemNix
#
# RULES MATTER: a config with only [allowlist] runs gitleaks with ZERO rules
# (defaults are NOT auto-loaded when a config exists) — this file was a complete
# no-op until 2026-08-18, the day Resend auto-revoked a Pocket ID SMTP key that
# an agent had pasted into docs/status/2026-06-11_…md (and a Synthetic LLM key
# sat leaked in five archived status reports). Any [[rules]] addition must keep
# [extend] useDefault = true.

[extend]
useDefault = true

# OVERRIDE of the default sourcegraph-access-token rule (same id replaces the
# upstream definition — verified live 2026-09-16). Upstream's regex carries a
# BARE 40-hex alternative armed by a rule keyword ANYWHERE in the file, so
# flake.nix's ~15 `github:.../<40-hex>` rev pins tripped it (the pins sit
# nowhere near the words, but the selftest comments mention "sourcegraph").
# A path allowlist for flake.nix was tried first (2026-09-16 07:28) and is
# WORSE: gitleaks applies allowlist paths at the directory-walker level, so
# the WHOLE file is skipped — a real sgp_/AWS/Slack/whatever token pasted
# into flake.nix would have been invisible (the allowlist comment claiming
# "a real sgp_ token anywhere — including flake.nix — still gets caught" was
# wrong; proven empirically). The override drops ONLY the bare-hex
# alternative: real Sourcegraph tokens are sgp_-prefixed (the shapes below),
# and sgp_-prefixed tokens are also what GitHub push protection
# pattern-matches (the 2026-09-15 GH013 class this file exists for). Side
# effect: bare 40-hex + rule-keyword is no longer a gitleaks class at all —
# the git-SHA false-positive class dies with it.
[[rules]]
id = "sourcegraph-access-token"
description = "Sourcegraph Access Token (sgp_ forms only; bare-hex alternative dropped 2026-09-16 — it false-positives on 40-hex git rev pins in keyword-bearing files)"
regex = '''(?i)\b(sgp_(?:[a-fA-F0-9]{16}|local)_[a-fA-F0-9]{40}|sgp_[a-fA-F0-9]{40})\b'''
entropy = 3
keywords = [
  "sgp_",
  "sourcegraph",
]

# gitleaks has no built-in Resend rule (verified 8.30.1) — the exact class that
# leaked. Keys look like: re_<33 chars, may contain underscores>.
[[rules]]
id = "resend-api-key"
description = "Resend API key"
regex = '''\bre_[A-Za-z0-9_]{30,}'''
keywords = ["re_"]

  # AGENTS.md carries the literal (already-REVOKED) key inside the pending
  # git-filter-repo --replace-text purge snippet. Remove this allowlist entry
  # after the history purge is pushed.
  [[rules.allowlists]]
  paths = ['''(^|/)AGENTS\.md$''']

# Synthetic LLM gateway keys (syn_<32 hex>) — leaked in 5 status reports
# 2026-07-29..2026-08-10 (and the Feb 2026 itermexport blob), redacted 2026-08-18.
[[rules]]
id = "synthetic-api-key"
description = "Synthetic API key"
regex = '''\bsyn_[A-Za-z0-9]{24,}'''
keywords = ["syn_"]

  # AGENTS.md carries the literal key inside the pending git-filter-repo
  # --replace-text purge snippet. Remove after the history purge is pushed.
  [[rules.allowlists]]
  paths = ['''(^|/)AGENTS\.md$''']

# NOTE: [[allowlists]] (plural, current syntax) throughout — [allowlist]
# (singular) is deprecated and CANNOT coexist with [[allowlists]] entries
# (gitleaks 8.30.1 fails config load: "cannot be used alongside").
[[allowlists]]
description = "Allowlist for known false positives"
paths = ['''patches\/.*\.patch$''']
regexes = [
  '''From [0-9a-f]{40} Mon''',
  '''YOUR_[A-Z_]+_KEY|YOUR_[A-Z_]+_TOKEN|REDACTED_.*_KEY''',
  # SigNoz upstream commit SHA cited verbatim in research docs
  '''49749626dc5197479c2da08105a52544f96b7da7''',
  # Prose ("Immich/Forgejo integration") caught by generic-api-key
  '''(?i)^immich/(forgejo|twenty)$''',
  # Canonical example ULID from the ULID spec (users_view.key parseability
  # fixture in VM tests + session docs) — a well-known literal, not a credential
  '''01ARZ3NDEKTSV4RRFFQ69G5FAV''',
]

# Detector-coverage fixtures (tests/fixtures/gitleaks/, consumed by the
# gitleaks-coverage-selftest flake check) deliberately carry NO path
# allowlist: with the sourcegraph rule overridden (above) every tracked
# fixture is clean under the repo config, and keeping them SCANNED means a
# real secret accidentally pasted into a fixture file still gets caught.
# The selftest scans fresh tmp copies, so its detection assertions are
# unaffected by whatever the repo-path scan sees.
