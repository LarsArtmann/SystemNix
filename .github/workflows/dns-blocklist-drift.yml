name: DNS blocklist hash drift

# Nightly consistency check for the blocklist SRI hashes
# (born as the HaGeZi mirror drift guard,
# docs/status/2026-10-03_02-25_hagezi-hash-drift-deploy-unblock.md).
#
# MODEL CHANGED 2026-11-24: the HaGeZi lists are PINNED-COMMIT GitHub raw
# URLs (see the `hagezi` helper in platforms/common/dns-blocklists.nix), so
# their bytes are immutable and cannot drift. This workflow now re-hashes
# against that pinned commit and is a REPAIR pass: a hash diff means the
# file's hash lines disagreed with the bytes the build fetches.
#
# THE 2026-11-25 DEPLOY BOMB THIS GUARD CAUSED: the script still hashed the
# MOVING GitLab-mirror main branch while the file pointed at the pinned
# GitHub commit, so the 04:30 UTC run (c7fb34007) wrote GitLab-HEAD hashes
# under pinned URLs. Six lists then mismatched their immutable bytes and
# every deploy died at the HaGeZi fixed-output derivations until the hashes
# were restored the same evening. scripts/dns-update.sh now reads the base
# URL from the file itself; never reintroduce a hardcoded mirror here or in
# the script.
#
# Loop semantics: run `scripts/dns-update.sh --hashes-only` nightly
# (--hashes-only so an auto-commit never bundles the unrelated
# StevenBlack commit-pin advance). A hash diff auto-commits and pushes
# directly; a green tree is a no-op. Moving the lists to a newer upstream
# release is NOT this job's work: bump the helper's commit and the hashes
# together in one deliberate change.
#
# The auto-commit does NOT build the toplevel (the refreshed hashes ARE
# the build fix — validation happens in nix-check.yml on the push, which
# runs the full `nix flake check`; a bad hash there opens a normal CI
# failure).

on:
  schedule:
    # Nightly 04:30 UTC — staggered away from flake-update (Mon 06:00)
    # and nixpkgs-compat (daily ~03:00).
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  refresh-hashes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators

      - name: Run the offline selftest first
        run: bash scripts/dns-update.sh --selftest

      - name: Refresh blocklist SRI hashes
        run: bash scripts/dns-update.sh --hashes-only

      - name: Auto-commit hash drift
        run: |
          if git diff --quiet -- platforms/common/dns-blocklists.nix; then
            echo "No drift — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add platforms/common/dns-blocklists.nix
          git commit -m "chore: refresh dns blocklist SRI hashes (HaGeZi mirror drift)

          Nightly consistency check (dns-blocklist-drift.yml): the list
          hash lines in platforms/common/dns-blocklists.nix disagreed with
          the bytes their pinned URLs serve; re-hashed via
          scripts/dns-update.sh --hashes-only so the next deploy's toplevel
          build fetches clean."
          git push
