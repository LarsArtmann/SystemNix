# The negative-test harness (scripts/negative-test-lints.sh) is the
# selftest suite for every eval-time assertion audit and lint contract in
# this repo (gatus/scrub/bridge/coverage/deadguard/memory-watermark/inputpin +
# pristine green controls). Until 2026-10-10 it ran ONLY when a local
# session remembered to — the CI leg closes that gap.
#
# Trigger map:
#   - push (paths): the harness itself, any lint/script it exercises, and
#     the module/lib/system trees its mutations and evals read.
#   - nightly schedule: re-proves the contracts against the CURRENT lock
#     (flake-update Monday, go-deps-audit 04:30 — this offsets after both).
#   - workflow_dispatch: manual runs.
#
# Cost note: the full suite is eval-bound (~2min/case toplevel evals; ~30+
# min cold on CI). That is why it is nightly + paths-gated instead of
# every-push (same tradeoff as go-deps-audit.yml).
name: Negative lint tests

on:
  push:
    branches: [master]
    paths:
      - scripts/negative-test-lints.sh
      - scripts/lib/**
      - scripts/check-*.sh
      - scripts/audit-*.sh
      - modules/nixos/services/**
      - lib/**
      - systems/**
      - platforms/**
      - tests/**
      - flake.nix
      - flake.lock
      - .github/workflows/negative-tests.yml
  schedule:
    - cron: "15 5 * * *" # nightly, offset after go-deps-audit (04:30)
  workflow_dispatch:

jobs:
  negative-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            # NIX_GITHUB_RO_TOKEN: see nix-check.yml — GITHUB_TOKEN cannot read
            # the owner's other private repos; 32 github:-type lock nodes need it.
            access-tokens = github.com=${{ secrets.NIX_GITHUB_RO_TOKEN || secrets.GITHUB_TOKEN }}

      # The harness's toplevel evals force every private flake input tree
      # Same bundle auth block as nix-check.yml / go-deps-audit.yml;
      # go-nix-helpers rides an HTTPS rewrite.
      - name: Configure private flake-input auth
        env:
          # One bundle secret serves EVERY private git+ssh flake input (46
          # LarsArtmann repos as of 2026-10-29): `@REPO <name>` headers, each
          # followed by that repo's read-only deploy key. A plain ssh-agent
          # CANNOT serve multiple deploy keys - GitHub accepts the FIRST key
          # offered and returns "Repository not found" for every other repo.
          # So each key gets its own Host alias (IdentitiesOnly) plus a
          # insteadOf rewrite per repo URL. New private input = append
          # `@REPO <name>` + key to the secret, zero workflow edits.
          NIX_DEPLOY_KEYS_BUNDLE: ${{ secrets.NIX_DEPLOY_KEYS_BUNDLE }}
        run: |
          while IFS= read -r line; do
            case "$line" in
              "@REPO "*) repo="${line#@REPO }"; kf="/tmp/nix-dk-$repo"; : > "$kf";;
              *) [ -n "${kf:-}" ] && printf '%s\n' "$line" >> "$kf";;
            esac
          done < <(printf '%s\n' "$NIX_DEPLOY_KEYS_BUNDLE")
          chmod 600 /tmp/nix-dk-*
          mkdir -p ~/.ssh
          : > ~/.ssh/nixci-config
          for kf in /tmp/nix-dk-*; do
            repo="${kf#/tmp/nix-dk-}"
            {
              echo "Host nixci-$repo"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile $kf"
              echo "  IdentitiesOnly yes"
              echo "  StrictHostKeyChecking accept-new"
            } >> ~/.ssh/nixci-config
            git config --global url."ssh://git@nixci-$repo/LarsArtmann/$repo".insteadOf "ssh://git@github.com/LarsArtmann/$repo"
          done
          git config --global url."https://github.com/LarsArtmann/go-nix-helpers".insteadOf "git@github.com:LarsArtmann/go-nix-helpers"
          echo "GIT_SSH_COMMAND=ssh -F $HOME/.ssh/nixci-config" >> "$GITHUB_ENV"

      # Full suite unfiltered: includes the pristine green controls (which
      # require a clean tree) and every group's fail/pass cases.
      - name: Run negative-test harness
        run: bash scripts/negative-test-lints.sh
