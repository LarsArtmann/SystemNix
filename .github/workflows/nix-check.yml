name: Nix flake check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            # NIX_GITHUB_RO_TOKEN: read-only PAT covering the owner's PRIVATE
            # repos. The job-scoped GITHUB_TOKEN only reads THIS repo, so every
            # `github:`-type lock node pointing at a private LarsArtmann repo
            # (32 as of 2026-09-03: bank-sync, browser-history, buildflow,
            # crush-config, ...) 404s on its api.github.com tarball fetch.
            # Deploy keys cannot fix this class: subtree nodes pinned by
            # upstream flakes at depth >= 2 are unreachable by follows.
            # Fallback keeps current behavior until the secret exists.
            access-tokens = github.com=${{ secrets.NIX_GITHUB_RO_TOKEN || secrets.GITHUB_TOKEN }}

      # Private flake inputs (CV, go-cqrs-lite, branching-flow,
      # file-and-image-renamer, BuildFlow — all git+ssh) need deploy keys;
      # the public go-nix-helpers input rides a git+ssh URL too (also
      # transitively through go-cqrs-lite), so rewrite that repo to
      # anonymous HTTPS instead of a deploy key.
      - name: Configure private flake-input auth
        env:
          NIX_DEPLOY_KEY_CV: ${{ secrets.NIX_DEPLOY_KEY_CV }}
          NIX_DEPLOY_KEY_GO_CQRS_LITE: ${{ secrets.NIX_DEPLOY_KEY_GO_CQRS_LITE }}
          NIX_DEPLOY_KEY_BRANCHING_FLOW: ${{ secrets.NIX_DEPLOY_KEY_BRANCHING_FLOW }}
          NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER: ${{ secrets.NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER }}
          NIX_DEPLOY_KEY_BUILDFLOW: ${{ secrets.NIX_DEPLOY_KEY_BUILDFLOW }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$NIX_DEPLOY_KEY_CV" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_GO_CQRS_LITE" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_BRANCHING_FLOW" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_BUILDFLOW" | ssh-add -
          git config --global url."https://github.com/LarsArtmann/go-nix-helpers".insteadOf "git@github.com:LarsArtmann/go-nix-helpers"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Validate flake structure
        run: nix flake show --allow-import-from-derivation 2>&1 | head -20

      - name: Run statix linter
        run: nix run nixpkgs#statix -- check .

      - name: Run deadnix linter
        run: nix run nixpkgs#deadnix -- --fail --no-lambda-pattern-names .

      - name: Check Nix formatting
        run: nix fmt -- --ci

      - name: Evaluate flake (no build)
        run: nix flake check --no-build

      # Trap-lints are pure runCommand checks (no VM, seconds to build).
      # `flake check --no-build` only EVALUATES them — a check whose script
      # logic is broken (phantom-green) or whose fixtures drift still passes
      # eval. Building them executes the actual grep/lint logic. This is the
      # class that let 7 gatus checks sit red-for-hours (2026-08-22) and the
      # signoz query-lint v1 nullglob phantom-green (2026-08-27) through.
      - name: Build trap-lint checks (pattern/query/module-shape audits)
        run: |
          nix build .#checks.x86_64-linux.gatus-pattern-lint --no-link --print-out-paths
          nix build .#checks.x86_64-linux.signoz-query-lint --no-link --print-out-paths
          nix build .#checks.x86_64-linux.module-shape-lint --no-link --print-out-paths
          nix build .#checks.x86_64-linux.chown-vs-bind-audit --no-link --print-out-paths
          nix build .#checks.x86_64-linux.binary-coverage-lint --no-link --print-out-paths
          nix build .#checks.x86_64-linux.binary-coverage-selftest --no-link --print-out-paths
          nix build .#checks.x86_64-linux.pre-deploy-metrics-selftest --no-link --print-out-paths
          nix build .#checks.x86_64-linux.post-deploy-pressure-selftest --no-link --print-out-paths
          nix build .#checks.x86_64-linux.gitleaks-coverage-selftest --no-link --print-out-paths
          nix build .#checks.x86_64-linux.dead-guard-lint --no-link --print-out-paths

      - name: Check for unregistered port numbers
        run: |
          # SOURCE-LEVEL complement to the eval-time port-registry-audit
          # (modules/nixos/services/port-registry-audit.nix, enforced by
          # `nix flake check`): the eval audit scans RESOLVED unit
          # Exec*/Environment text (sees through variable indirection and
          # FAILS the build), while this warning-only grep catches ports in
          # source forms that never reach unit text — Caddy configs, docker
          # compose fragments, inline script literals. The eval audit owns
          # unit-wired ports; this net owns everything else.
          # The eval-time assertion in lib/default.nix catches duplicates WITHIN
          # ports.nix. Only match bare numeric assignments (= NNNN) or proxy-style :NNNN at
          # end of string — avoids connection URIs, memory sizes, time values.
          UNREGISTERED=$(
            grep -rnE '(=|:)[[:space:]]*[0-9]{4,5}([^0-9MiB]|$)' --include="*.nix" modules/ 2>/dev/null |
            grep -vE 'ports\.|^\s*#|Timeout|Burst|Interval|Nice|Quota|Memory|Limit|Watchdog|Signal|UMask|Delay|Retry|Second|OnUnit|OnBoot|fallocate|offset|subvolid|Year|Month|threshold|priority|version|uid|gid|capacity|window|slim|tty|vtnr|code|exit|status|color|port_range|GOMEMLIMIT|BLOB_MAX|max-old-space|min-size|avg-size|bantime|Duration|default|stateVersion' ||
            true
          )
          # Filter out well-known ports inside Docker connection strings and
          # container port mappings (not configurable via lib/ports.nix)
          FILTERED=$(echo "$UNREGISTERED" | grep -vE '(postgres|redis|mongodb)://|containerPort|NODE_PORT|127\.0\.0\.1.*:|localhost.*:|max_old_space|postgresql://' || true)
          if [ -n "$FILTERED" ]; then
            echo "::warning::Potential unregistered port numbers found (review and move to lib/ports.nix if applicable):"
            echo "$FILTERED" | head -20
          else
            echo "No unregistered port numbers detected"
          fi

      - name: Check templ generated files are committed
        run: scripts/check-templ-committed.sh

      # Build-time shell (runCommand bodies) runs under stdenv nullglob —
      # unquoted command-variable expansion silently deletes glob-bearing
      # words (signoz-query-lint v1 phantom-green, 2026-08-27).
      - name: Nullglob audit of runCommand bodies
        run: scripts/audit-shell-nullglob.sh

      # Textfile collectors: fixed .tmp writes collide with foreign-owned
      # leftovers in the sticky 1777 dir and block the final mv (mail-relay
      # 2026-09-02..06 outage), and /run/secrets-rendered is a phantom path
      # real sops-nix never renders (divergent mock default validated it).
      - name: Textfile tmp-path audit
        run: scripts/audit-textfile-tmp.sh

      # GitHub push protection ignores gitleaks allowlists and
      # pattern-matches raw blobs — only @HEX40@ template fixtures may be
      # tracked (2026-09-15 GH013 push block on an allowlisted fixture).
      - name: Push-protection literal audit
        run: |
          scripts/audit-push-protection-literals.sh --selftest
          scripts/audit-push-protection-literals.sh

      # serviceConfig = X // Y shallow-merges discard mkDefault/mkForce
      # priority silently — lib.mkMerge [...] is the only sanctioned merge.
      # Selftest first (a scanner must prove it still detects), then scan.
      - name: serviceConfig shallow-merge audit
        run: |
          scripts/audit-serviceconfig-merge.sh --selftest
          scripts/audit-serviceconfig-merge.sh

      # The pre-commit GOTOOLCHAIN guard's narrowed predicate silently
      # dropped the unquoted/spaced nix shape once already (2026-09-22
      # review); the selftest extracts the live predicate from the hook and
      # pins the catch/pass boundary.
      - name: GOTOOLCHAIN guard selftest
        run: scripts/test-gotoolchain-guard.sh

      - name: Flake input hygiene (ref=master + GOTOOLCHAIN)
        run: |
          # Fail on GOTOOLCHAIN=auto (sandbox purity violation)
          if grep -rnE 'GOTOOLCHAIN.*auto' --include="*.nix" . 2>/dev/null | grep -v 'GOTOOLCHAIN.*off' | grep -q .; then
            echo "::error::GOTOOLCHAIN=auto found — breaks Nix sandbox purity"
            grep -rnE 'GOTOOLCHAIN.*auto' --include="*.nix" . 2>/dev/null | grep -v 'GOTOOLCHAIN.*off'
            exit 1
          fi
          # Warn on ref=master (reproducibility risk)
          MASTER_COUNT=$(grep -c 'ref\s*=\s*"master"' flake.nix 2>/dev/null || echo "0")
          if [ "$MASTER_COUNT" -gt 0 ]; then
            echo "::warning::$MASTER_COUNT flake inputs use ref=master — consider pinning"
          fi

  vm-tests:
    runs-on: ubuntu-latest
    # Matrix (2026-09-14 gate split): the pre-commit hook now runs
    # `nix flake check --no-build` (eval-only), so CI is the ONLY place VM
    # tests build. One runner per test (fail-fast=false) keeps the wall
    # clock at the slowest single test instead of the sum.
    strategy:
      fail-fast: false
      matrix:
        test:
          - boot
          - attic
          - searxng
          - caddy-auth-patterns
          - gatus-patterns
          - pma-identity
          - ksm
          - port-uniqueness
          - browser-history
          - paperless
          - hermes
          - cv
          - memory-emergency-guard
          - pool-recovery
          - btrbk-rescue
          - niri-session
          - tmp-cleanup
          - mail-relay
          - wifi-failover
          - miniflux
          - lib-helpers
          - sed-delimiter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same auth as the nix-check job: VM-test BUILDS force the source of
      # every private input (branching-flow went private 2026-08 and its
      # anonymous tarball fetch 404s when lars-packages forces its flake
      # outputs — see lib/lars-packages.nix).
      - name: Configure private flake-input auth
        env:
          NIX_DEPLOY_KEY_CV: ${{ secrets.NIX_DEPLOY_KEY_CV }}
          NIX_DEPLOY_KEY_GO_CQRS_LITE: ${{ secrets.NIX_DEPLOY_KEY_GO_CQRS_LITE }}
          NIX_DEPLOY_KEY_BRANCHING_FLOW: ${{ secrets.NIX_DEPLOY_KEY_BRANCHING_FLOW }}
          NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER: ${{ secrets.NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER }}
          NIX_DEPLOY_KEY_BUILDFLOW: ${{ secrets.NIX_DEPLOY_KEY_BUILDFLOW }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$NIX_DEPLOY_KEY_CV" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_GO_CQRS_LITE" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_BRANCHING_FLOW" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_BUILDFLOW" | ssh-add -
          git config --global url."https://github.com/LarsArtmann/go-nix-helpers".insteadOf "git@github.com:LarsArtmann/go-nix-helpers"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      - name: Enable KVM for VM tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            access-tokens = github.com=${{ secrets.NIX_GITHUB_RO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run NixOS VM test (${{ matrix.test }})
        run: nix build ".#checks.x86_64-linux.${{ matrix.test }}" --no-link --print-out-paths

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
      - name: Run shellcheck on scripts
        run: nix shell nixpkgs#shellcheck --command shellcheck --severity=error scripts/*.sh .githooks/*
