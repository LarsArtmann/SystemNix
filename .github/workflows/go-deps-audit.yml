# Cross-reference every LarsArtmann consumer go.mod `require` against the
# revs SystemNix pins in flake.lock (scripts/audit-go-deps.sh).
#
# Trigger map:
#   - push (flake.lock / flake.nix / the script): gate every lock change —
#     the ERROR-MISSING class (consumer requires a tag that does not exist
#     upstream) must never land silently.
#   - nightly schedule: re-validate the committed lock against CURRENT
#     upstream (catches upstream-side drift, e.g. force-pushed tags).
#   - workflow_dispatch: manual runs.
#
# Owner decisions embedded (Q1-Q3 of the 2026-08-22 05-30 report were never
# answered; these are the safe defaults, revisit on owner input):
#   Q1 WARN-DIVERGED stays ADVISORY (exit 0) — the ecosystem rebases master,
#      so "pin older" is unprovable; nothing blocks on it.
#   Q2 CI, not pre-deploy — the audit costs minutes per run; deploys must
#      not pay that when CI covers it nightly + on every lock push.
#   Q3 fetch-free — CI has NO local clones by design (PROJECTS_DIR points at
#      an empty dir); tag resolution rides anonymous ls-remote, and a FAILED
#      lookup downgrades to WARN-UNKNOWN (never a false ERROR-MISSING red —
#      private repos 404 on anonymous https by design).
name: Go deps audit

on:
  push:
    branches: [master]
    paths:
      - flake.lock
      - flake.nix
      - scripts/audit-go-deps.sh
      - .github/workflows/go-deps-audit.yml
  schedule:
    - cron: "30 4 * * *" # nightly, offset from the Monday flake-update job
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            # NIX_GITHUB_RO_TOKEN: see nix-check.yml — GITHUB_TOKEN cannot read
            # the owner's other private repos; 32 github:-type lock nodes need it.
            access-tokens = github.com=${{ secrets.NIX_GITHUB_RO_TOKEN || secrets.GITHUB_TOKEN }}

      # The audit's `nix eval` of input outPaths forces every private input
      # tree (all LarsArtmann repos are git+ssh). Same auth block as
      # nix-check.yml; go-nix-helpers rides an HTTPS rewrite.
      - name: Configure private flake-input auth
        env:
          # One bundle secret serves EVERY private git+ssh flake input (46
          # LarsArtmann repos as of 2026-10-29): `@REPO <name>` headers, each
          # followed by that repo's read-only deploy key. A plain ssh-agent
          # CANNOT serve multiple deploy keys - GitHub accepts the FIRST key
          # offered and returns "Repository not found" for every other repo.
          # So each key gets its own Host alias (IdentitiesOnly) plus a
          # insteadOf rewrite per repo URL. New private input = append
          # `@REPO <name>` + key to the secret, zero workflow edits.
          NIX_DEPLOY_KEYS_BUNDLE: ${{ secrets.NIX_DEPLOY_KEYS_BUNDLE }}
        run: |
          while IFS= read -r line; do
            case "$line" in
              "@REPO "*) repo="${line#@REPO }"; kf="/tmp/nix-dk-$repo"; : > "$kf";;
              *) [ -n "${kf:-}" ] && printf '%s\n' "$line" >> "$kf";;
            esac
          done < <(printf '%s\n' "$NIX_DEPLOY_KEYS_BUNDLE")
          chmod 600 /tmp/nix-dk-*
          mkdir -p ~/.ssh
          : > ~/.ssh/nixci-config
          for kf in /tmp/nix-dk-*; do
            repo="${kf#/tmp/nix-dk-}"
            {
              echo "Host nixci-$repo"
              echo "  HostName github.com"
              echo "  User git"
              echo "  IdentityFile $kf"
              echo "  IdentitiesOnly yes"
              echo "  StrictHostKeyChecking accept-new"
            } >> ~/.ssh/nixci-config
            git config --global url."ssh://git@nixci-$repo/LarsArtmann/$repo".insteadOf "ssh://git@github.com/LarsArtmann/$repo"
          done
          git config --global url."https://github.com/LarsArtmann/go-nix-helpers".insteadOf "git@github.com:LarsArtmann/go-nix-helpers"
          echo "GIT_SSH_COMMAND=ssh -F $HOME/.ssh/nixci-config" >> "$GITHUB_ENV"

      # Exit 1 only on ERROR-MISSING (tag genuinely absent upstream) or FATAL
      # (lock parse broken). WARN-DIVERGED / WARN-UNKNOWN are advisory.
      - name: Run Go dependency audit
        env:
          PROJECTS_DIR: ${{ runner.temp }}/no-local-clones
        run: bash scripts/audit-go-deps.sh
