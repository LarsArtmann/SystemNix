name: nixpkgs compatibility

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  compat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Verify flake.lock nixpkgs is github type (pre-update)
        run: |
          type=$(nix eval --impure --json --expr 'let lock = builtins.fromJSON (builtins.readFile ./flake.lock); in lock.nodes.nixpkgs.original.type or "unknown"' 2>/dev/null | tr -d '"')
          if [ "$type" != "github" ]; then
            echo "::error::flake.lock nixpkgs is type '$type', expected 'github' — refusing to proceed"
            exit 1
          fi
          echo "nixpkgs type is github — safe to update"

      - name: Update nixpkgs and check compatibility
        id: update-check
        continue-on-error: true
        run: |
          # Temporarily update nixpkgs to latest
          nix flake update nixpkgs --no-use-registries

          # Verify it didn't regress to tarball
          type=$(nix eval --impure --json --expr 'let lock = builtins.fromJSON (builtins.readFile ./flake.lock); in lock.nodes.nixpkgs.original.type or "unknown"' 2>/dev/null | tr -d '"')
          if [ "$type" != "github" ]; then
            echo "::error::nixpkgs regressed to type '$type' after update"
            exit 1
          fi

          # Run eval check against updated nixpkgs
          nix flake check --no-build

      - name: Create issue on failure
        if: steps.update-check.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nixpkgs-compat',
              state: 'open'
            });
            if (existing.data.length > 0) {
              console.log('Issue already exists, skipping creation');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `nixpkgs compatibility broken (${date})`,
              body: [
                'The daily nixpkgs compatibility check failed.',
                '',
                'This means SystemNix does not evaluate against the latest `nixos-unstable`.',
                'A package was likely removed, renamed, or an option changed.',
                '',
                '**Action required:**',
                '1. Run `nix flake update nixpkgs --no-use-registries` locally',
                '2. Run `nix flake check --no-build` to see the error',
                '3. Fix the breakage before the next deploy',
                '',
                '[View workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')'
              ].join('\n'),
              labels: ['nixpkgs-compat', 'bug']
            });
