name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes pipe-operators
            # Same access-tokens fallback as nix-check.yml: the job-scoped
            # GITHUB_TOKEN cannot read the 32+ private `github:`-type lock
            # nodes, so without NIX_GITHUB_RO_TOKEN the update dies on the
            # first private tarball fetch (all five weekly runs since
            # 2026-08-31 failed — the bot never once succeeded).
            access-tokens = github.com=${{ secrets.NIX_GITHUB_RO_TOKEN || secrets.GITHUB_TOKEN }}

      # Ported from nix-check.yml: private git+ssh ROOT inputs (CV,
      # go-cqrs-lite, branching-flow, file-and-image-renamer, BuildFlow)
      # need deploy keys; the public go-nix-helpers git+ssh URL is
      # rewritten to anonymous HTTPS.
      - name: Configure private flake-input auth
        env:
          NIX_DEPLOY_KEY_CV: ${{ secrets.NIX_DEPLOY_KEY_CV }}
          NIX_DEPLOY_KEY_GO_CQRS_LITE: ${{ secrets.NIX_DEPLOY_KEY_GO_CQRS_LITE }}
          NIX_DEPLOY_KEY_BRANCHING_FLOW: ${{ secrets.NIX_DEPLOY_KEY_BRANCHING_FLOW }}
          NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER: ${{ secrets.NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER }}
          NIX_DEPLOY_KEY_BUILDFLOW: ${{ secrets.NIX_DEPLOY_KEY_BUILDFLOW }}
          NIX_DEPLOY_KEY_PROJECT_DEPENDENCY_GRAPH: ${{ secrets.NIX_DEPLOY_KEY_PROJECT_DEPENDENCY_GRAPH }}
          NIX_DEPLOY_KEY_PROJECT_DISCOVERY_SDK: ${{ secrets.NIX_DEPLOY_KEY_PROJECT_DISCOVERY_SDK }}
        run: |
          eval "$(ssh-agent -s)" >/dev/null
          printf '%s\n' "$NIX_DEPLOY_KEY_CV" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_GO_CQRS_LITE" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_BRANCHING_FLOW" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_FILE_AND_IMAGE_RENAMER" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_BUILDFLOW" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_PROJECT_DEPENDENCY_GRAPH" | ssh-add -
          printf '%s\n' "$NIX_DEPLOY_KEY_PROJECT_DISCOVERY_SDK" | ssh-add -
          git config --global url."https://github.com/LarsArtmann/go-nix-helpers".insteadOf "git@github.com:LarsArtmann/go-nix-helpers"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"

      # Warm every input's source through Nix's parallel fetch thread pool
      # BEFORE the serialized walk below — `nix flake update` itself fetches
      # inputs one at a time (Nix 2.31 release notes: "serialized on-demand
      # fetching"); prefetch-inputs is the official parallel path.
      - name: Prefetch all inputs in parallel
        run: nix flake prefetch-inputs

      - name: Update flake inputs
        run: nix flake update

      # The Nix global registry rewrites github:NixOS/nixpkgs/nixos-unstable to a
      # channels.nixos.org tarball during `nix flake update`. The tarball pointer
      # can be stale by months and trips the eval-time nixpkgsTarballGuard. This
      # step normalizes the nixpkgs node back to github type at the latest rev.
      # See scripts/fix-nixpkgs-lock.sh and the gotcha in docs/agents/nix-flakes.md.
      - name: Normalize nixpkgs node to github type
        run: bash scripts/fix-nixpkgs-lock.sh --latest

      - name: Verify flake evaluates
        run: nix flake check --no-build

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock"

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore: update flake.lock"
          body: |
            Automated flake input updates.

            The nixpkgs node has been normalized to github type to avoid the
            tarball regression. Review the diff carefully — breaking changes in
            nixpkgs or service inputs may require manual fixes (e.g. vendorHash
            for Go packages).
          branch: automated/flake-lock-update
          delete-branch: true
